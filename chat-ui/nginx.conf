# The scheme the BROWSER used, which is not the scheme that reached us.
#
# In deployment TLS is terminated at the edge and this server is reached over
# plain HTTP on an internal network, so `$scheme` here says "http" for a request
# a person made over https. Passing that on costs the session cookie its
# `Secure` flag, because the server derives that from the forwarded scheme. So
# the header is passed THROUGH when there is one, and falls back to our own
# scheme when this server is the edge, which is how it is reached in dev.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    #
    # It has to come after every real route, because `try_files ... /index.html`
    # answers ANYTHING it is given: a path this server does not know becomes the
    # chat page with a 200, not a 404. That is right for a route the router owns
    # and wrong for everything else, and it is how the node installer below spent
    # a day appearing to work: `curl | sh` was piping this HTML into a shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Where a GPU machine gets the node from.
    #
    # Unauthenticated, and served by the orchestrator (KB/35). It lives here as
    # well as on the console's own origin because a customer's machines are told
    # ONE address, and it is this one.
    location /inference/download/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $releases http://orchestrator:8080;
        proxy_pass $releases;
        proxy_http_version 1.1;
        # Tarballs are tens of megabytes and a slow line is not an error.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + SSE stream proxy to the orchestrator. The variable + resolver
    # defer DNS to request time, so nginx starts even when the orchestrator
    # container is not on this network yet.
    location /v1/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $orchestrator http://orchestrator:8080;
        proxy_pass $orchestrator;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        # WebSocket upgrade (WS channel lands later).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
