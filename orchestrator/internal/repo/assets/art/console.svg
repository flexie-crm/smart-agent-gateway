<svg viewBox="0 0 1160 706" role="img" aria-label="The SAG console: the dashboard, with models, agents and machines in the navigation" xmlns="http://www.w3.org/2000/svg">
  <title>The SAG console</title>
  <style>
    .f { fill: var(--surface); }
    .side { fill: var(--sidebar); }
    .line { stroke: var(--line); stroke-width: 1; fill: none; }
    .soft { fill: var(--soft); }
    .t { fill: var(--fg); font: 13px var(--ui); }
    .tm { fill: var(--muted); font: 12px var(--ui); }
    .tt { fill: var(--muted); font: 10.5px var(--ui); letter-spacing: .07em; }
    .h { fill: var(--fg); font: 600 19px var(--ui); letter-spacing: -.01em; }
    .n { fill: var(--fg); font: 600 25px var(--ui); letter-spacing: -.02em; }
    .th { fill: var(--muted); font: 600 10.5px var(--ui); letter-spacing: .07em; }
    .ink { fill: var(--ink); }
    .g { stroke: var(--muted); stroke-width: 1.35; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .gi { stroke: var(--fg); stroke-width: 1.35; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x=".5" y=".5" width="1159" height="705" rx="13" class="f line"/>
  <clipPath id="cwin"><rect x="1" y="1" width="1158" height="704" rx="12"/></clipPath>
  <g clip-path="url(#cwin)">

    <!-- ───────────────────────── navigation ───────────────────────── -->
    <rect x="1" y="1" width="235" height="704" class="side"/>
    <line x1="236" y1="1" x2="236" y2="705" class="line"/>

    <rect x="21" y="25" width="22" height="22" rx="7" class="ink"/>
    <path d="M27 41v-6a5 5 0 0 1 10 0v6" stroke="var(--on-ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="52" y="41" class="h" font-size="15">Flexie SAG</text>

    <text x="20" y="82" class="tt">OVERVIEW</text>
    <rect x="12" y="92" width="212" height="30" rx="7" fill="var(--sel)"/>
    <g transform="translate(21 98.5)" class="g"><rect x="1" y="2.5" width="7" height="13" rx="1.5"/><rect x="10" y="2.5" width="7" height="7" rx="1.5"/></g>
    <text x="48" y="112" class="t" font-weight="600">Dashboard</text>
    <g transform="translate(21 136.5)" class="g"><path d="M2 3.5h14v9.5h-8.5l-3.5 3.2v-3.2H2z"/></g>
    <text x="48" y="150" class="t">Chat</text>
    <text x="20" y="192" class="tt">THE ENGINE</text>
    <g transform="translate(21 202.5)" class="g"><path d="M5.5 2v4M12.5 2v4M3 6h12v4.5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/></g>
    <text x="48" y="216" class="t">Vendors</text>
    <g transform="translate(21 238.5)" class="g"><rect x="2" y="2" width="14" height="14" rx="2.5"/><rect x="6.5" y="6.5" width="5" height="5" rx="1"/></g>
    <text x="48" y="252" class="t">Models</text>
    <g transform="translate(21 274.5)" class="g"><rect x="1.5" y="3" width="15" height="10" rx="2"/><path d="M6 16h6"/><circle cx="9" cy="8" r="2.2"/></g>
    <text x="48" y="288" class="t">Inference</text>
    <g transform="translate(21 310.5)" class="g"><circle cx="9" cy="6.5" r="3.6"/><path d="M3 16a6 6 0 0 1 12 0"/></g>
    <text x="48" y="324" class="t">Agents</text>
    <g transform="translate(21 346.5)" class="g"><path d="M12.4 2.4a4.3 4.3 0 0 0-5 5.6l-4.6 4.6a1.7 1.7 0 0 0 2.4 2.4l4.6-4.6a4.3 4.3 0 0 0 5.6-5l-2.6 2.6-2.4-.6-.6-2.4z"/></g>
    <text x="48" y="360" class="t">Tools</text>
    <g transform="translate(21 382.5)" class="g"><path d="M9 2.6a3 3 0 0 0-3 3v.3a3 3 0 0 0-1.4 5.3 3 3 0 0 0 2.6 3.9h1.8zM9 2.6a3 3 0 0 1 3 3v.3a3 3 0 0 1 1.4 5.3 3 3 0 0 1-2.6 3.9H9z"/></g>
    <text x="48" y="396" class="t">Brains</text>
    <g transform="translate(21 418.5)" class="g"><path d="M6.5 11.5 10 8a2.5 2.5 0 0 1 3.5 3.5L11 14M11.5 6.5 8 10a2.5 2.5 0 0 1-3.5-3.5L7 4"/></g>
    <text x="48" y="432" class="t">MCP Servers</text>
    <text x="20" y="476" class="tt">ACCESS</text>
    <g transform="translate(21 486.5)" class="g"><circle cx="9" cy="5.5" r="3.2"/><path d="M3.5 15.5a5.5 5.5 0 0 1 11 0"/></g>
    <text x="48" y="500" class="t">Users</text>
    <g transform="translate(21 522.5)" class="g"><circle cx="6.5" cy="6" r="2.8"/><circle cx="13" cy="7" r="2.2"/><path d="M2 15a4.5 4.5 0 0 1 9 0M11.5 12.6a3.6 3.6 0 0 1 4.5 2.4"/></g>
    <text x="48" y="536" class="t">Groups</text>
    <g transform="translate(21 558.5)" class="g"><circle cx="5.5" cy="9" r="3"/><path d="M8.5 9H16M13.5 9v3M16 9v2.2"/></g>
    <text x="48" y="572" class="t">Roles</text>
    <g transform="translate(21 594.5)" class="g"><path d="M2.5 15.5v-11l6-2v13M8.5 15.5v-7l7-2v9M1 15.5h16M5 7.5v0M5 10.5v0M11.5 10v0M11.5 12.5v0"/></g>
    <text x="48" y="608" class="t">Workspaces</text>

    <line x1="1" y1="645" x2="236" y2="645" class="line"/>
    <circle cx="30" cy="675" r="11" class="soft"/>
    <text x="30" y="679" class="tm" font-size="11" text-anchor="middle">JO</text>
    <text x="50" y="679" class="t">John Ogilvy</text>

    <!-- ───────────────────────── the dashboard ───────────────────────── -->
    <text x="272" y="52" class="h">Dashboard</text>
    <line x1="272" y1="74" x2="1124" y2="74" class="line"/>

    <g>
      <text x="272" y="106" class="th">CONVERSATIONS TODAY</text>
      <text x="272" y="140" class="n">1,284</text>
      <text x="484" y="106" class="th">ANSWERS GIVEN</text>
      <text x="484" y="140" class="n">9,671</text>
      <text x="696" y="106" class="th">AGENTS RUNNING</text>
      <text x="696" y="140" class="n">7</text>
      <text x="908" y="106" class="th">PEOPLE CONNECTED</text>
      <text x="908" y="140" class="n">23</text>
      <circle cx="964" cy="132" r="4" fill="var(--ok)"/>
    </g>
    <line x1="272" y1="168" x2="1124" y2="168" class="line"/>

    <!-- a week of traffic, monotone cubic, drawn the way the product draws one -->
    <text x="272" y="200" class="th">THIS WEEK</text>
    <g class="g" stroke-opacity=".3" stroke-width="1">
      <line x1="272" y1="228" x2="1124" y2="228"/>
      <line x1="272" y1="272" x2="1124" y2="272"/>
      <line x1="272" y1="316" x2="1124" y2="316"/>
    </g>
    <path d="M288 306 C 360 300 400 246 472 250 C 544 254 580 292 652 286 C 724 280 760 224 832 222 C 904 220 940 262 1012 248 C 1064 238 1088 224 1108 218"
          stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1108" cy="218" r="3.6" class="ink"/>
    <text x="288" y="336" class="tm" font-size="11">Mon</text>
    <text x="470" y="336" class="tm" font-size="11">Wed</text>
    <text x="650" y="336" class="tm" font-size="11">Fri</text>
    <text x="1086" y="336" class="tm" font-size="11">Sun</text>
    <line x1="272" y1="360" x2="1124" y2="360" class="line"/>

    <!-- the agents table -->
    <text x="272" y="392" class="th">AGENTS</text>
    <g class="th">
      <text x="272" y="424">NAME</text>
      <text x="560" y="424">MODEL</text>
      <text x="812" y="424">ABILITIES</text>
      <text x="1010" y="424">STATE</text>
    </g>
    <line x1="272" y1="436" x2="1124" y2="436" class="line"/>

    <g class="t">
      <text x="272" y="466">Gateway</text>
      <text x="560" y="466" class="tm">Anthropic / claude-opus-4-8</text>
      <text x="812" y="466" class="tm">14</text>
      <text x="272" y="512">Accounts researcher</text>
      <text x="560" y="512" class="tm">OpenAI / gpt-5.2</text>
      <text x="812" y="512" class="tm">6</text>
      <text x="272" y="558">Contract reader</text>
      <text x="560" y="558" class="tm">gpu-1 / qwen3-27b</text>
      <text x="812" y="558" class="tm">3</text>
      <text x="272" y="604">Release notes</text>
      <text x="560" y="604" class="tm">Anthropic / claude-sonnet-5</text>
      <text x="812" y="604" class="tm">4</text>
    </g>
    <g>
      <rect x="1010" y="452" width="52" height="20" rx="10" fill="var(--ok)" opacity=".16"/><text x="1036" y="466" class="tm" font-size="11" text-anchor="middle" fill="var(--ok-fg)">on</text>
      <rect x="1010" y="498" width="52" height="20" rx="10" fill="var(--ok)" opacity=".16"/><text x="1036" y="512" class="tm" font-size="11" text-anchor="middle" fill="var(--ok-fg)">on</text>
      <rect x="1010" y="544" width="52" height="20" rx="10" fill="var(--ok)" opacity=".16"/><text x="1036" y="558" class="tm" font-size="11" text-anchor="middle" fill="var(--ok-fg)">on</text>
      <rect x="1010" y="590" width="52" height="20" rx="10" class="soft"/><text x="1036" y="604" class="tm" font-size="11" text-anchor="middle">off</text>
    </g>
    <line x1="272" y1="484" x2="1124" y2="484" class="line"/>
    <line x1="272" y1="530" x2="1124" y2="530" class="line"/>
    <line x1="272" y1="576" x2="1124" y2="576" class="line"/>
    <line x1="272" y1="622" x2="1124" y2="622" class="line"/>
  </g>
</svg>
