<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SAG</title>
<style>
  /* The chat's own colours: see enterprise/shell/connect/index.html. */
  :root { color-scheme: light dark; --ink:#1f2225; --dim:#5f646a; --line:#e5e7ea; --bar:#1f2225; }
  body { background:#fafbfc; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#d2d4d8; --dim:#999fa7; --line:#2b2f36; --bar:#d2d4d8; }
    body { background:#1c1e22; }
  }
  /* And when the person has chosen, which beats what the computer is set to. */
  :root[data-night] { --ink:#d2d4d8; --dim:#999fa7; --line:#2b2f36; --bar:#d2d4d8; }
  :root[data-night] body { background:#1c1e22; }
  :root[data-night] #status.failed { color:#f2b8b5; }
  body {
    margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    font:14px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink);
  }
  .box { width:min(28rem, 78vw); text-align:center; }
  .name { font-size:1.05rem; letter-spacing:-.01em; }
  .name b { font-weight:600; }
  .name .thin { font-weight:300; color:var(--dim); }
  #status { margin-top:.6rem; color:var(--dim); min-height:1.6em; }
  #status.failed { color:#b3261e; }
  @media (prefers-color-scheme: dark) { #status.failed { color:#f2b8b5; } }
  /* The number sits in a box of its own, wide enough for "100%" and with the
     digits all one width, so a centred line does not jump sideways every time
     it changes. */
  #percent { font-variant-numeric:tabular-nums; display:inline-block; min-width:3.4ch; text-align:left; }
  .track { margin-top:1.25rem; height:3px; background:var(--line); border-radius:999px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--bar); border-radius:999px; transition:none; }
  /* Nothing is loading any more, so there is nothing for a bar to say. Keyed off
     the message beside it, which is the element that is actually marked: it used
     to be keyed off the track's own class, which nothing has set since the
     failure was moved onto the message, so the bar stayed under the error. */
  #status.failed + .track { display:none; }
</style>
<script>
  // Painted from what the person chose, not from what the computer is set to.
  //
  // This screen belongs to the application and the chat belongs to a server:
  // different origins, different storage, so it cannot read the choice made in
  // there. The shell knows it (the page tells it once when it changes) and
  // hands it over here. Without this, somebody who set the application to night
  // still opened white every time, and then watched it change.
  (function () {
    var want = new URLSearchParams(location.search).get('appearance')
    var dark =
      want === 'dark' ||
      (want !== 'light' &&
        window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    if (dark) document.documentElement.setAttribute('data-night', '')
    // The ground, inline, so the first painted frame is this colour rather than
    // whatever is behind an unstyled document.
    document.documentElement.style.background = dark ? '#1c1e22' : '#fafbfc'
  })()
</script>
</head>
<body>
  <div class="box">
    <div class="name"><b>SAG</b> <span class="thin">Smart Agent Gateway</span></div>
    <div id="status">Loading <span id="percent">0%</span></div>
    <div class="track"><div id="bar"></div></div>
  </div>
<script>
  ;(function () {
    var bar = document.getElementById('bar')
    var status = document.getElementById('status')
    var percent = document.getElementById('percent')
    if (!bar || !status || !percent) return
    var paint = function (at) {
      bar.style.width = at + '%'
      percent.textContent = Math.round(at) + '%'
    }

    // Where the bar is, and it is the same rule in both editions.
    //
    // Two things decide it and it takes the LOWER: how far the work has actually
    // got, and how far the part nobody can measure has (see unmeasured below).
    // So it can never claim to be further on than the work is, which is what a
    // clock alone does when a first run has a database to create and every
    // migration to apply, and it never stops moving while there is still
    // something to wait for.
    //
    // HELD is WAITING_STAYS in main.rs: one number in two places, changed
    // together.
    var HELD = 1500
    var began = Date.now()
    var reported = 0
    var drawing = true

    // Called by the shell, which is the only half that knows what is happening.
    window.__sagProgress = function (percent) {
      reported = Math.max(reported, Math.min(99, percent))
    }
    // And this is it saying the wait is over. The chat is waiting for the frame
    // this draws, so the end of the bar is on the screen before it is taken
    // away: two animation frames, the same wait as the one that reports a page
    // has first painted, because it is the same question.
    window.__sagDone = function () {
      reported = 100
      paint(100)
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          window.__TAURI__.core.invoke('waiting_finished')
        })
      })
    }

    // How far along the part of the wait that NOTHING measures is.
    //
    // The gateway says how far it has got; the chat loading after it says
    // nothing at all, and on a warm machine that is most of the wait. Drawn as a
    // curve that always advances and never arrives: 89 when the second and a
    // half is up, 96 at three seconds, closer every frame after that, 99 in the
    // limit. A bar that stops moving says the application has stopped, and one
    // that reaches the end and waits there says it louder.
    //
    // The last step is not on this curve. A hundred is the shell's to say and it
    // says it as it opens the chat.
    var unmeasured = function () {
      return 99 * (1 - Math.exp(-(Date.now() - began) / (HELD / 2.3)))
    }

    var draw = function () {
      if (!drawing) return
      // Something went wrong and the page is saying so. It is not loading any
      // more, and painting over that message every frame would hide it.
      if (status.className === 'failed') return (drawing = false)
      paint(reported >= 100 ? 100 : Math.min(reported, unmeasured()))
      requestAnimationFrame(draw)
    }
    requestAnimationFrame(draw)
  })()
</script>
</body>
</html>
